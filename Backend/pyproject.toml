[project]
name = "interview-mentor-api"
version = "1.0.0"
description = "Production-oriented Interview Mentor API and worker"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "asyncpg==0.32.0",
  "email-validator==2.3.0",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.1.4",
  "structlog==25.5.0",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.0.0",
  "ruff==0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"tests/**/*.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --cov=app.domains --cov=app.services --cov=app.core.security --cov-branch --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["app/integrations/groq.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
