name: Keep Render service awake

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-service-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the public liveness endpoint
        shell: bash
        run: |
          for attempt in {1..8}; do
            if curl --fail --silent --show-error --max-time 30 \
              https://interview-mentor-premmaity.onrender.com/health/live; then
              exit 0
            fi
            sleep 10
          done
          exit 1
