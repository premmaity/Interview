name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check app tests
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file /tmp/interview-mentor-requirements.txt
          uv run pip-audit --no-deps --disable-pip -r /tmp/interview-mentor-requirements.txt
      - name: Validate clean migration and rollback
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./migration-ci.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t interview-mentor-api:test Backend
      - run: docker build -t interview-mentor-web:test Frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: uv sync --frozen
        working-directory: Backend
      - run: npm ci
        working-directory: Frontend
      - name: Start fake-provider stack
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+aiosqlite:///./e2e-ci.db
          FRONTEND_ORIGIN: http://127.0.0.1:4173
          AI_PROVIDER: fake
        run: |
          cd Backend
          uv run alembic upgrade head
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          cd ../Frontend
          VITE_API_BASE_URL=http://127.0.0.1:8000 npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8000/health/live && curl -fsS http://127.0.0.1:4173/ && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
        working-directory: Frontend
      - run: npm exec playwright test
        working-directory: Frontend
