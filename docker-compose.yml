name: interview-mentor

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  migrate:
    build: ./Backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://interview:interview@postgres:5432/interview
      REDIS_URL: redis://redis:6379/0
      FRONTEND_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      EVALUATION_DISPATCH: redis
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./Backend
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 4s
      retries: 15

  worker:
    build: ./Backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:8080"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["object-storage"]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: localminio-change-me
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres-data:
  redis-data:
  minio-data:
